name: Deploy Infrastructure

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      backendImageTag:
        description: "Backend image tag"
        required: false
      frontendImageTag:
        description: "Frontend image tag"
        required: false
      llmProcessorImageTag:
        description: "LLM Processor image tag"
        required: false
      gatewayImageTag:
        description: "Gateway image tag"
        required: false
      backendRef:
        description: "FinanceApp.Backend git ref containing the migrations to apply"
        required: false

permissions:
  id-token: write
  contents: read

env:
  AZURE_RESOURCE_GROUP: projects

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      createCert: ${{ steps.check-cert.outputs.createCert }}
      managedEnvironmentName: ${{ steps.deployment-config.outputs.managedEnvironmentName }}
      gatewayDomain: ${{ steps.deployment-config.outputs.gatewayDomain }}
      gatewayImageTag: ${{ steps.resolve-image-tags.outputs.gatewayImageTag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Read Deployment Configuration
        id: deployment-config
        run: |
          PARAMETERS_FILE="$RUNNER_TEMP/main.production.json"
          az bicep build-params \
            --file main.production.bicepparam \
            --outfile "$PARAMETERS_FILE"

          echo "keyVaultName=$(jq -r '.parameters.keyVaultName.value' "$PARAMETERS_FILE")" >> "$GITHUB_OUTPUT"
          echo "managedEnvironmentName=$(jq -r '.parameters.managedEnvironmentName.value' "$PARAMETERS_FILE")" >> "$GITHUB_OUTPUT"
          echo "gatewayDomain=$(jq -r '.parameters.gatewayCustomDomain.value' "$PARAMETERS_FILE")" >> "$GITHUB_OUTPUT"

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Enable Key Vault ARM Template Deployment
        run: |
          az keyvault update \
            --name "${{ steps.deployment-config.outputs.keyVaultName }}" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --enabled-for-template-deployment true \
            --bypass AzureServices \
            --output none

      - name: Checkout Backend migrations
        uses: actions/checkout@v6
        with:
          repository: Sziszka90/FinanceApp.Backend
          ref: ${{ github.event.inputs.backendRef || 'main' }}
          token: ${{ secrets.GHCR_PAT }}
          path: backend

      - name: Setup .NET for database migrations
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.401"
          skip-lts-prepass: true

      - name: Apply database migrations
        env:
          KEY_VAULT_NAME: ${{ steps.deployment-config.outputs.keyVaultName }}
        run: |
          CONNECTION_STRING="$(az keyvault secret show \
            --vault-name "$KEY_VAULT_NAME" \
            --name finance-app-db-connection-string \
            --query value \
            --output tsv)"
          if [ -z "$CONNECTION_STRING" ]; then
            echo "Database connection string secret is empty or unavailable."
            exit 1
          fi
          echo "::add-mask::$CONNECTION_STRING"
          dotnet tool install --global dotnet-ef --version 10.0.10
          export PATH="$PATH:$HOME/.dotnet/tools"
          cd backend
          ./scripts/run-migration.sh mssql "$CONNECTION_STRING"

      - name: Check Certificate Existence
        id: check-cert
        run: |
          echo "🔍 Checking if certificate exists..."
          CERT_COUNT=$(az containerapp env certificate list \
            --name "${{ steps.deployment-config.outputs.managedEnvironmentName }}" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "length([?properties.subjectName=='${{ steps.deployment-config.outputs.gatewayDomain }}'])" \
            --output tsv)

          if [ "$CERT_COUNT" -gt 0 ]; then
            echo "✅ Certificate exists"
            echo "createCert=false" >> $GITHUB_OUTPUT
          else
            echo "❌ Certificate does not exist"
            echo "createCert=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy Template
        id: resolve-image-tags
        env:
          INPUT_BACKEND_IMAGE_TAG: ${{ github.event.inputs.backendImageTag }}
          INPUT_FRONTEND_IMAGE_TAG: ${{ github.event.inputs.frontendImageTag }}
          INPUT_LLM_PROCESSOR_IMAGE_TAG: ${{ github.event.inputs.llmProcessorImageTag }}
          INPUT_GATEWAY_IMAGE_TAG: ${{ github.event.inputs.gatewayImageTag }}
        run: |
          resolve_image_tag() {
            local requested_tag="$1"
            local app_name="$2"
            if [ -n "$requested_tag" ]; then
              printf '%s' "$requested_tag"
              return
            fi

            local current_image
            current_image="$(az containerapp show \
              --name "$app_name" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query 'properties.template.containers[0].image' \
              --output tsv 2>/dev/null || true)"
            if [ -n "$current_image" ] && [ "$current_image" != "None" ]; then
              printf '%s' "${current_image##*:}"
            else
              printf '%s' 'latest'
            fi
          }

          BACKEND_IMAGE_TAG="$(resolve_image_tag "$INPUT_BACKEND_IMAGE_TAG" finance-app-backend)"
          FRONTEND_IMAGE_TAG="$(resolve_image_tag "$INPUT_FRONTEND_IMAGE_TAG" finance-app-frontend)"
          LLM_PROCESSOR_IMAGE_TAG="$(resolve_image_tag "$INPUT_LLM_PROCESSOR_IMAGE_TAG" finance-app-llmprocessor)"
          GATEWAY_IMAGE_TAG="$(resolve_image_tag "$INPUT_GATEWAY_IMAGE_TAG" finance-app-gateway)"
          echo "Deploying backend image tag: $BACKEND_IMAGE_TAG"
          echo "Deploying frontend image tag: $FRONTEND_IMAGE_TAG"
          echo "Deploying LLM processor image tag: $LLM_PROCESSOR_IMAGE_TAG"
          echo "Deploying gateway image tag: $GATEWAY_IMAGE_TAG"
          echo "backendImageTag=$BACKEND_IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "frontendImageTag=$FRONTEND_IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "llmProcessorImageTag=$LLM_PROCESSOR_IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "gatewayImageTag=$GATEWAY_IMAGE_TAG" >> "$GITHUB_OUTPUT"

          az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "deploy-${{ github.run_number }}" \
            --template-file ./main.bicep \
            --mode Incremental \
            --parameters \
              ./main.production.bicepparam \
              "backendImageTag=$BACKEND_IMAGE_TAG" \
              "frontendImageTag=$FRONTEND_IMAGE_TAG" \
              "llmProcessorImageTag=$LLM_PROCESSOR_IMAGE_TAG" \
              "gatewayImageTag=$GATEWAY_IMAGE_TAG" \
              "createGatewayCertificate=${{ steps.check-cert.outputs.createCert }}" \
              "revisionSuffix=${{ github.run_number }}" \
              "environment=production" \
            --query properties.outputs \
            --output json > deployment-outputs.json

      - name: Display Deployment Outputs
        id: get-outputs
        run: |
          echo "✅ Deployment completed successfully!"
          echo "Deployment name: deploy-${{ github.run_number }}"

          echo "📊 Deployment Outputs:"
          cat deployment-outputs.json | jq '.'

          # Extract and display URLs
          echo ""
          echo "🌐 Application URLs:"
          echo "Frontend: https://$(cat deployment-outputs.json | jq -r '.frontendUrl.value')"
          echo "Gateway: https://$(cat deployment-outputs.json | jq -r '.gatewayUrl.value')"
          echo "Backend: http://$(cat deployment-outputs.json | jq -r '.backendUrl.value')"
          echo "LLM Processor: http://$(cat deployment-outputs.json | jq -r '.llmProcessorUrl.value')"

          echo ""
          echo "💾 Infrastructure:"
          echo "SQL Server: $(cat deployment-outputs.json | jq -r '.sqlServerFqdn.value')"
          echo "Log Analytics: $(cat deployment-outputs.json | jq -r '.logAnalyticsWorkspaceId.value')"

  bind-certificate:
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Wait for Managed Certificate
        if: needs.deploy.outputs.createCert == 'true'
        run: |
          for attempt in {1..30}; do
            CERT_COUNT=$(az containerapp env certificate list \
              --name "${{ needs.deploy.outputs.managedEnvironmentName }}" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "length([?properties.subjectName=='${{ needs.deploy.outputs.gatewayDomain }}'])" \
              --output tsv 2>/dev/null || echo 0)

            if [ "$CERT_COUNT" -gt 0 ]; then
              echo "Managed certificate resource is available."
              exit 0
            fi

            echo "Waiting for managed certificate resource (attempt $attempt/30)..."
            sleep 10
          done

          echo "Managed certificate did not become available in time."
          exit 1

      - name: Deploy Stage - Bind SSL Certificate
        run: |
          az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "cert-binding-${{ github.run_number }}" \
            --template-file ./cert-binding.bicep \
            --mode Incremental \
            --parameters \
              ./cert-binding.production.bicepparam \
              "gatewayImageTag=${{ needs.deploy.outputs.gatewayImageTag }}" \
            --output none

      - name: Display Cert Binding Stage Outputs
        run: |
          echo "✅ Cert Binding Stage - SSL Certificate binding completed!"
          echo ""
          echo "🔒 Custom Domain with SSL:"
          echo "Gateway with SSL: https://${{ needs.deploy.outputs.gatewayDomain }}"
